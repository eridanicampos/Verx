name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true # ativa RestoreLockedMode (Directory.Build.props)

jobs:
  build-test:
    name: Build, testes e cobertura
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore (lock files obrigatórios)
        run: dotnet restore CashFlow.slnx --locked-mode

      - name: Build (zero warnings — TreatWarningsAsErrors)
        run: dotnet build CashFlow.slnx -c Release --no-restore

      - name: Vulnerabilidades (diretas e transitivas, inclusive projetos de teste)
        run: |
          dotnet list CashFlow.slnx package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -q "has the following vulnerable packages" vuln.txt; then
            echo "::error::Dependências com vulnerabilidades conhecidas"; exit 1
          fi

      - name: Testes (unitários, contrato, integração com Testcontainers)
        run: >
          dotnet test --solution CashFlow.slnx -c Release --no-build
          --report-trx --results-directory TestResults
          --coverlet --coverlet-output-format cobertura

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/*.cobertura.xml
          retention-days: 14

  licenses:
    name: Governança de licenças
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificar licenças permissivas (diretas + transitivas)
        run: python3 scripts/check-licenses.py --report license-report.md
      - uses: actions/upload-artifact@v7
        with:
          name: license-report
          path: license-report.md

  containers-e2e:
    name: Containers, healthchecks e teste de carga
    runs-on: ubuntu-24.04
    needs: build-test
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Gerar segredos efêmeros do job
        run: ./scripts/generate-secrets.sh

      - name: Build das imagens (multi-stage)
        run: docker compose build

      - name: Subir stack e aguardar healthchecks
        run: docker compose up -d --wait --wait-timeout 240

      - name: Teste de carga — consolidado 50 rps (máx. 5% de perda) + escrita concorrente
        run: >
          dotnet run -c Release --project src/Tests/CashFlow.LoadTest --
          --base-url http://localhost:8000
          --password-file secrets/identity/Identity__SeedUsers__0__Password
          --scenario mixed --rps 50 --write-rps 20 --duration 60
          --max-error-rate 0.05 --p95-ms 500 --output loadtest-results

      - name: Resiliência — broker fora do ar não bloqueia lançamentos
        run: |
          docker compose stop rabbitmq
          dotnet run -c Release --project src/Tests/CashFlow.LoadTest -- \
            --base-url http://localhost:8000 \
            --password-file secrets/identity/Identity__SeedUsers__0__Password \
            --scenario transactions --write-rps 10 --duration 15 --accounts 5 --output loadtest-results &
          LOAD=$!
          sleep 25
          docker compose start rabbitmq
          wait $LOAD

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: loadtest-results
          path: |
            loadtest-results/
            compose-logs.txt
          if-no-files-found: ignore

      # O instalador oficial do Trivy baixa de get.trivy.dev, domínio que não resolve mais.
      # Instalamos direto do release no GitHub (com verificação de checksum) e pulamos o setup da action.
      - name: Instalar Trivy
        env:
          TRIVY_VERSION: "0.70.0"
        run: |
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " $tarball\$" "trivy_${TRIVY_VERSION}_checksums.txt" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$tarball" -C "$HOME/.local/bin" trivy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/trivy" --version

      - name: Scan de vulnerabilidades das imagens (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          skip-setup-trivy: true
          image-ref: cashflow/transactions:local
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table

      - name: Derrubar stack
        if: always()
        run: docker compose down -v

  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform/environments/prod
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
      - run: terraform fmt -check -recursive ../..
      - run: terraform init -backend=false -input=false
      - run: terraform validate
